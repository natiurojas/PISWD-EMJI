<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07111F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>R/F CONTROL</title>
  <style>
    :root {
      --bg: #050B12;
      --panel: rgba(9, 22, 34, 0.92);
      --line: #24495B;
      --cyan: #56E1FF;
      --green: #7CFFB2;
      --orange: #FFB454;
      --red: #FF5C6E;
      --purple: #B58CFF;
      --text: #DCEBF5;
      --muted: #7B9AAE;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 20% 0%, rgba(86, 225, 255, 0.10), transparent 55%),
        radial-gradient(circle at 85% 100%, rgba(181, 140, 255, 0.10), transparent 55%),
        var(--bg);
    }

    #app {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: max(10px, env(safe-area-inset-top)) 14px max(12px, env(safe-area-inset-bottom));
      min-height: 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex: 0 0 auto;
    }

    .brand {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .brand b {
      font-size: 15px;
      letter-spacing: 3px;
      color: var(--cyan);
    }

    .brand span {
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--muted);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--muted);
      white-space: nowrap;
    }

    .status i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 8px currentColor;
      color: var(--red);
    }

    .status.online {
      color: var(--green);
      border-color: rgba(124, 255, 178, 0.4);
    }

    .status.online i {
      background: var(--green);
      color: var(--green);
    }

    .telemetry {
      flex: 0 0 auto;
      display: grid;
      gap: 7px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 10px;
      letter-spacing: 1.2px;
    }

    .row .tag {
      width: 62px;
      color: var(--muted);
      font-weight: 700;
    }

    .row .tag.player {
      color: var(--green);
    }

    .row .tag.enemy {
      color: var(--red);
    }

    .bar {
      flex: 1;
      height: 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #0B1B28;
      overflow: hidden;
    }

    .bar > i {
      display: block;
      height: 100%;
      width: 100%;
      background: var(--green);
      transition: width 0.15s linear;
    }

    .bar.enemy > i {
      background: var(--red);
    }

    .row .value {
      width: 54px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 9px;
      letter-spacing: 1.2px;
      color: var(--muted);
    }

    .meta b {
      color: var(--orange);
      font-weight: 700;
    }

    .scene {
      font-size: 9px;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-align: center;
      flex: 0 0 auto;
      min-height: 12px;
    }

    .scene b {
      color: var(--cyan);
    }

    .controls {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 0;
      padding: 4px 0;
    }

    .stick-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .stick {
      position: relative;
      width: min(44vw, 190px);
      height: min(44vw, 190px);
      border-radius: 50%;
      border: 2px solid var(--line);
      background:
        radial-gradient(circle, rgba(86, 225, 255, 0.08), transparent 68%),
        rgba(7, 17, 27, 0.85);
      touch-action: none;
    }

    .stick::before,
    .stick::after {
      content: "";
      position: absolute;
      background: rgba(36, 73, 91, 0.7);
    }

    .stick::before {
      left: 50%;
      top: 12%;
      bottom: 12%;
      width: 1px;
      transform: translateX(-50%);
    }

    .stick::after {
      top: 50%;
      left: 12%;
      right: 12%;
      height: 1px;
      transform: translateY(-50%);
    }

    .knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 38%;
      height: 38%;
      margin: 0;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 35% 30%, #A8F3FF, var(--cyan) 45%, #1C7C96 100%);
      border: 2px solid rgba(220, 251, 255, 0.65);
      box-shadow: 0 0 22px rgba(86, 225, 255, 0.45), inset 0 0 14px rgba(0, 0, 0, 0.25);
      pointer-events: none;
      transition: transform 0.05s linear;
    }

    .hint {
      font-size: 9px;
      letter-spacing: 1.6px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: stretch;
      width: min(38vw, 160px);
    }

    .button {
      position: relative;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.6px;
      padding: 0;
      height: min(23vw, 88px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      touch-action: none;
      transition: transform 0.06s ease, background 0.06s linear, box-shadow 0.06s linear;
    }

    .button small {
      font-size: 8px;
      font-weight: 400;
      letter-spacing: 1px;
      color: var(--muted);
    }

    .button.fire {
      border-color: rgba(255, 92, 110, 0.55);
      color: var(--red);
      box-shadow: 0 0 16px rgba(255, 92, 110, 0.14);
    }

    .button.shield {
      border-color: rgba(86, 225, 255, 0.55);
      color: var(--cyan);
      box-shadow: 0 0 16px rgba(86, 225, 255, 0.14);
    }

    .button.active {
      transform: scale(0.95);
    }

    .button.fire.active {
      background: rgba(255, 92, 110, 0.22);
      box-shadow: 0 0 28px rgba(255, 92, 110, 0.45);
    }

    .button.shield.active {
      background: rgba(86, 225, 255, 0.20);
      box-shadow: 0 0 28px rgba(86, 225, 255, 0.45);
    }

    .button.cooling {
      opacity: 0.45;
      color: var(--muted);
      border-color: var(--line);
      box-shadow: none;
    }

    .footer {
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
      gap: 14px;
      font-size: 8px;
      letter-spacing: 1.4px;
      color: var(--muted);
    }

    .footer span b {
      color: var(--purple);
    }

    @media (orientation: landscape) and (max-height: 520px) {
      #app {
        gap: 5px;
        padding-top: max(6px, env(safe-area-inset-top));
        padding-bottom: max(6px, env(safe-area-inset-bottom));
      }

      .telemetry {
        padding: 6px 10px;
        gap: 4px;
      }

      .scene {
        display: none;
      }

      .stick {
        width: min(34vh, 160px);
        height: min(34vh, 160px);
      }

      .actions {
        flex-direction: row;
        width: auto;
        gap: 10px;
      }

      .button {
        width: min(26vh, 130px);
        height: min(26vh, 130px);
      }

      .footer {
        display: none;
      }
    }

    @media (orientation: landscape) and (max-height: 380px) {
      header .brand span {
        display: none;
      }

      .telemetry {
        padding: 4px 9px;
      }

      .stick {
        width: min(30vh, 130px);
        height: min(30vh, 130px);
      }

      .button {
        width: min(24vh, 110px);
        height: min(24vh, 110px);
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <b>R/F CONTROL</b>
        <span>MANDO DE COMBATE</span>
      </div>
      <div class="status" id="status"><i></i><span id="statusText">BUSCANDO PC</span></div>
    </header>

    <div class="telemetry">
      <div class="row">
        <span class="tag player">ESCUDO</span>
        <div class="bar"><i id="playerBar"></i></div>
        <span class="value" id="playerValue">--</span>
      </div>
      <div class="row">
        <span class="tag enemy">ENEMIGO</span>
        <div class="bar enemy"><i id="enemyBar"></i></div>
        <span class="value" id="enemyValue">--</span>
      </div>
      <div class="meta">
        <span id="levelText">SIN COMBATE</span>
        <span>ESCUDO <b id="shieldText">LISTO</b></span>
      </div>
    </div>

    <div class="scene" id="sceneText">ABRÍ EL JUEGO EN LA PC Y ENTRÁ A UN NIVEL</div>

    <div class="controls">
      <div class="stick-zone">
        <div class="stick" id="stick">
          <div class="knob" id="knob"></div>
        </div>
        <span class="hint">MOVER</span>
      </div>

      <div class="actions">
        <button class="button fire" id="fire" type="button">
          DISPARAR
          <small>MANTENER</small>
        </button>
        <button class="button shield" id="shield" type="button">
          ESCUDO
          <small>MANTENER</small>
        </button>
      </div>
    </div>

    <div class="footer">
      <span>PC: <b>/index.html</b></span>
      <span>MISMA RED WI-FI</span>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const state = {
        x: 0,
        y: 0,
        fire: false,
        shield: false
      };

      const statusEl = document.getElementById("status");
      const statusText = document.getElementById("statusText");
      const playerBar = document.getElementById("playerBar");
      const enemyBar = document.getElementById("enemyBar");
      const playerValue = document.getElementById("playerValue");
      const enemyValue = document.getElementById("enemyValue");
      const levelText = document.getElementById("levelText");
      const shieldText = document.getElementById("shieldText");
      const sceneText = document.getElementById("sceneText");
      const stick = document.getElementById("stick");
      const knob = document.getElementById("knob");
      const fireButton = document.getElementById("fire");
      const shieldButton = document.getElementById("shield");

      let gameConnected = false;
      let lastPing = 0;
      let stickPointer = null;
      let stickCenter = { x: 0, y: 0 };
      let stickRadius = 1;
      let sendTimer = null;

      function vibrate(pattern) {
        if (navigator.vibrate)
          navigator.vibrate(pattern);
      }

      function setConnection(connected) {
        if (gameConnected === connected)
          return;

        gameConnected = connected;
        statusEl.classList.toggle("online", connected);
        statusText.textContent = connected ? "PC CONECTADA" : "BUSCANDO PC";

        if (connected)
          vibrate(30);
      }

      function setScene(text, detail = "") {
        sceneText.innerHTML = detail
          ? `${text} <b>${detail}</b>`
          : text;
      }

      function clamp01(value) {
        const number = Number(value);
        return Number.isFinite(number) ? Math.max(0, Math.min(1, number)) : 0;
      }

      function renderState(data) {
        if (!data || typeof data !== "object")
          return;

        lastPing = Date.now();
        setConnection(true);

        const playerMax = Math.max(1, Number(data.playerMaxHp) || 1);
        const enemyMax = Math.max(1, Number(data.enemyMaxHp) || 1);
        const playerHp = Math.max(0, Number(data.playerHp) || 0);
        const enemyHp = Math.max(0, Number(data.enemyHp) || 0);

        if (data.scene === "fight") {
          levelText.textContent = String(data.level || "COMBATE").toUpperCase();
          playerValue.textContent = `${Math.ceil(playerHp)}/${Math.ceil(playerMax)}`;
          enemyValue.textContent = `${Math.ceil(enemyHp)}/${Math.ceil(enemyMax)}`;
          playerBar.style.width = `${clamp01(playerHp / playerMax) * 100}%`;
          enemyBar.style.width = `${clamp01(enemyHp / enemyMax) * 100}%`;

          if (data.finished) {
            setScene(data.victory ? "VICTORIA" : "NAVE DESTRUIDA", `PUNTAJE ${data.score || 0}`);
          }
          else {
            setScene("EN COMBATE", data.manual ? "CONTROL MANUAL" : "PILOTO AUTOMÁTICO");
          }
        }
        else {
          levelText.textContent = "SIN COMBATE";
          playerValue.textContent = "--";
          enemyValue.textContent = "--";
          playerBar.style.width = "0%";
          enemyBar.style.width = "0%";
          setScene("ENTRÁ A UN NIVEL EN LA PC");
        }

        const shield = Number(data.shield) || 0;
        const shieldCooldown = Number(data.shieldCooldown) || 0;

        if (shield > 0) {
          shieldText.textContent = `ACTIVO ${shield.toFixed(1)}s`;
          shieldText.style.color = "var(--green)";
        }
        else if (shieldCooldown > 0) {
          shieldText.textContent = `RECARGA ${shieldCooldown.toFixed(1)}s`;
          shieldText.style.color = "var(--orange)";
        }
        else {
          shieldText.textContent = "LISTO";
          shieldText.style.color = "var(--green)";
        }

        shieldButton.classList.toggle("cooling", shieldCooldown > 0);
      }

      let lastSendAt = 0;
      let dirty = true;

      function send(force = false) {
        const now = Date.now();

        if (!force) {
          if (now - lastSendAt < 50) {
            dirty = true;
            return;
          }

          if (!dirty && now - lastSendAt < 500)
            return;
        }

        dirty = false;
        lastSendAt = now;

        const payload = JSON.stringify({
          x: Math.round(state.x * 1000) / 1000,
          y: Math.round(state.y * 1000) / 1000,
          fire: state.fire === true,
          shield: state.shield === true
        });

        fetch("/control", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          cache: "no-store",
          body: payload
        })
          .then(response => {
            if (!response.ok)
              throw new Error("control");
          })
          .catch(() => setConnection(false));
      }

      function startSending() {
        if (sendTimer !== null)
          return;

        sendTimer = setInterval(send, 50);
      }

      function stopSending() {
        if (sendTimer === null)
          return;

        clearInterval(sendTimer);
        sendTimer = null;
      }

      function centerStick() {
        state.x = 0;
        state.y = 0;
        knob.style.transform = "translate(-50%, -50%)";
        knob.style.transition = "transform 0.12s ease-out";
        setTimeout(() => {
          knob.style.transition = "transform 0.05s linear";
        }, 130);
        send();
      }

      function updateStick(event) {
        if (event.pointerId !== stickPointer)
          return;

        const dx = event.clientX - stickCenter.x;
        const dy = event.clientY - stickCenter.y;
        const distance = Math.hypot(dx, dy);
        const limit = stickRadius * 0.72;
        const scale = distance > limit ? limit / distance : 1;
        const knobX = dx * scale;
        const knobY = dy * scale;

        knob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;

        const deadZone = 0.16;
        let nx = knobX / limit;
        let ny = knobY / limit;
        const magnitude = Math.hypot(nx, ny);

        if (magnitude < deadZone) {
          nx = 0;
          ny = 0;
        }
        else {
          const normalized = (magnitude - deadZone) / (1 - deadZone);
          nx = (nx / magnitude) * normalized;
          ny = (ny / magnitude) * normalized;
        }

        state.x = nx;
        state.y = ny;
      }

      function measureStick() {
        const rect = stick.getBoundingClientRect();
        stickCenter = {
          x: rect.left + rect.width / 2,
          y: rect.top + rect.height / 2
        };
        stickRadius = rect.width / 2;
      }

      stick.addEventListener("pointerdown", event => {
        event.preventDefault();
        measureStick();
        stickPointer = event.pointerId;
        stick.setPointerCapture(event.pointerId);
        updateStick(event);
        send();
      });

      stick.addEventListener("pointermove", event => {
        if (stickPointer === null)
          return;

        event.preventDefault();
        updateStick(event);
        send();
      });

      function releaseStick(event) {
        if (stickPointer === null || event.pointerId !== stickPointer)
          return;

        stickPointer = null;
        centerStick();
      }

      stick.addEventListener("pointerup", releaseStick);
      stick.addEventListener("pointercancel", releaseStick);
      stick.addEventListener("lostpointercapture", releaseStick);

      function bindHoldButton(button, key) {
        let pointerId = null;

        const press = event => {
          event.preventDefault();
          pointerId = event.pointerId;
          button.setPointerCapture(event.pointerId);
          button.classList.add("active");
          state[key] = true;
          vibrate(12);
          send();
        };

        const release = event => {
          if (pointerId !== null && event.pointerId !== pointerId)
            return;

          pointerId = null;
          button.classList.remove("active");
          state[key] = false;
          send();
        };

        button.addEventListener("pointerdown", press);
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("lostpointercapture", release);
        button.addEventListener("contextmenu", event => event.preventDefault());
      }

      bindHoldButton(fireButton, "fire");
      bindHoldButton(shieldButton, "shield");

      window.addEventListener("blur", () => {
        state.fire = false;
        state.shield = false;
        state.x = 0;
        state.y = 0;
        fireButton.classList.remove("active");
        shieldButton.classList.remove("active");
        centerStick();
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden)
          stopSending();
        else {
          startSending();
          send();
        }
      });

      window.addEventListener("resize", measureStick);
      window.addEventListener("orientationchange", () => setTimeout(measureStick, 150));

      function connectEvents() {
        const source = new EventSource("/events?role=controller");

        source.addEventListener("status", event => {
          try {
            const data = JSON.parse(event.data);
            setConnection(data.gameConnected === true);

            if (data.gameConnected === true)
              lastPing = Date.now();
          }
          catch (error) {
            // Evento inválido, se ignora.
          }
        });

        source.addEventListener("state", event => {
          try {
            renderState(JSON.parse(event.data));
          }
          catch (error) {
            // Evento inválido, se ignora.
          }
        });

        source.addEventListener("error", () => {
          // EventSource reintenta solo; marcamos desconexión visual.
          setConnection(false);
        });
      }

      setInterval(() => {
        if (Date.now() - lastPing > 4000)
          setConnection(false);
      }, 1000);

      startSending();
      connectEvents();
      measureStick();

      window.addEventListener("pagehide", () => {
        state.fire = false;
        state.shield = false;
        send(true);
      });
    })();
  </script>
</body>
</html>
